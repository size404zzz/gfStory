name: Build Documentation

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: gfstory-production
  cancel-in-progress: true

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: 'recursive'
      - name: Log Disk Space
        run: df -h
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          large-packages: false
          swap-storage: false
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick pngquant zip
          if ! command -v magick >/dev/null 2>&1; then
            sudo tee /usr/local/bin/magick >/dev/null <<'EOF'
          #!/usr/bin/env bash
          set -e
          if [[ "${1:-}" == "identify" ]]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          EOF
            sudo chmod +x /usr/local/bin/magick
          fi
          magick -version
          wget https://github.com/vgmstream/vgmstream-releases/releases/download/nightly/vgmstream-linux-cli.tar.gz
          tar -zxf vgmstream-linux-cli.tar.gz
          mkdir bin
          mv vgmstream-cli bin
          chmod a+x bin/*
          echo "${PWD}/bin" >> $GITHUB_PATH
      - name: Restore Cached Resources
        id: restore-gf-downloader-resources
        uses: actions/cache/restore@v5
        with:
          path: |
            unpack/downloader/output
          key: gf-downloader-resources-v2-${{ runner.os }}-${{ hashFiles('unpack/gf-data-ch/resdata_no_hash.json', 'unpack/downloader.patch') }}
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: 3.12
      - name: Setup Python Environment
        run: |
          cd unpack
          uv sync
      - name: Download Resources
        if: steps.restore-gf-downloader-resources.outputs.cache-hit != 'true'
        run: |
          cd unpack
          source .venv/bin/activate
          mkdir -p downloader/resdata
          cp gf-data-ch/resdata_no_hash.json downloader/resdata/ch_resdata.json
          cd downloader
          git apply ../downloader.patch
          zip -j resdata.zip resdata/ch_resdata.json
          python downloader.py --downloadres 0 --abname
      - name: Cache Downloaded Resources
        if: steps.restore-gf-downloader-resources.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            unpack/downloader/output
          key: ${{ steps.restore-gf-downloader-resources.outputs.cache-primary-key }}
      - name: Restore Cached Resources (images)
        id: restore-image-resources
        uses: actions/cache/restore@v5
        with:
          path: |
            unpack/images
          key: gf-image-resources-v2-${{ runner.os }}-${{ hashFiles('unpack/src/gfunpack/**', 'unpack/tests/test_backgrounds.py', 'unpack/tests/test_characters.py', 'unpack/gf-data-ch/resdata_no_hash.json') }}
      - name: Unpack images
        if: steps.restore-image-resources.outputs.cache-hit != 'true'
        run: |
          cd unpack
          source .venv/bin/activate
          python tests/test_backgrounds.py
          python tests/test_characters.py
      - name: Cache Resources (images)
        if: steps.restore-image-resources.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            unpack/images
          key: ${{ steps.restore-image-resources.outputs.cache-primary-key }}
      - name: Restore Cached Resources (audio)
        id: restore-audio-resources
        uses: actions/cache/restore@v5
        with:
          path: |
            unpack/audio
          key: gf-audio-resources-v2-${{ runner.os }}-${{ hashFiles('unpack/src/gfunpack/**', 'unpack/tests/test_audio.py', 'unpack/gf-data-ch/resdata_no_hash.json') }}
      - name: Restore Cached Resources (stories)
        id: restore-story-resources
        uses: actions/cache/restore@v5
        with:
          path: |
            unpack/stories
          key: gf-story-resources-v2-${{ runner.os }}-${{ hashFiles('unpack/src/gfunpack/**', 'unpack/tests/test_audio.py', 'unpack/tests/test_characters.py', 'unpack/tests/test_stories.py', 'unpack/gf-data-ch/resdata_no_hash.json', 'unpack/downloader.patch') }}
      - name: Unpack audio
        if: steps.restore-audio-resources.outputs.cache-hit != 'true'
        run: |
          cd unpack
          source .venv/bin/activate
          python tests/test_audio.py
      - name: Cache Resources (audio)
        if: steps.restore-audio-resources.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            unpack/audio
          key: ${{ steps.restore-audio-resources.outputs.cache-primary-key }}
      - name: Generate stories
        if: steps.restore-story-resources.outputs.cache-hit != 'true'
        run: |
          cd unpack
          source .venv/bin/activate
          python tests/test_stories.py
      - name: Cache Resources (stories)
        if: steps.restore-story-resources.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            unpack/stories
          key: ${{ steps.restore-story-resources.outputs.cache-primary-key }}
      - name: Log Disk Space
        run: df -h
      - name: Move Resources
        run: |
          cd unpack
          cp audio/audio.json images/backgrounds.json images/characters.json stories/stories.json stories/chapters.json ../src/assets
          mv audio ../public
          mv images ../public
          mv stories ../public
      - name: Validate generated resources
        run: |
          set -euo pipefail
          for file in \
            src/assets/audio.json \
            src/assets/backgrounds.json \
            src/assets/characters.json \
            src/assets/stories.json \
            src/assets/chapters.json; do
            test -s "$file"
          done
          test -d public/audio
          test -d public/images
          test -d public/stories
          du -sh public/audio public/images public/stories
      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9.4.0
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Setup PNPM Workspace
        run: |
          pnpm install --frozen-lockfile
      - name: Build Site
        run: |
          pnpm build-index
          pnpm build
      - name: Validate site output
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/simulator.html
          test -s dist/viewer.html
          test -d dist/audio
          test -d dist/images
          test -d dist/stories
      - name: Publish to Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy
